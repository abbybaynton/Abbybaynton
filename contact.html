<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact – Abby Baynton</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<header>
    <nav class="container">
        <a href="index.html" class="logo">Abby Baynton</a>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="testimonials.html">Testimonials</a></li>
            <li><a href="blog.html">Blog</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<section class="container">
    <h1>Contact Abby</h1>
    <p>Ready to skyrocket your book sales? Fill out the form below or connect on social media.</p>

    <form action="https://formspree.io/f/xwkgzjvn" method="POST" id="contactForm">
        <input type="text" name="name" placeholder="Name" required>
        <input type="email" name="email" placeholder="Email" required>
        <textarea name="message" placeholder="Your message..." rows="6" required></textarea>
        <button type="submit">Send Message</button>
    </form>
    <p id="contactMsg" style="display:none;color:green;">Your message has been successfully submitted.</p>

    <div style="margin-top:40px;">
        <h3>Follow Abby</h3>
        <div class="social">
            <a href="https://twitter.com/" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
            <a href="https://facebook.com/" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
            <a href="https://instagram.com/" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://linkedin.com/" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
        </div>
    </div>
</section>

<footer>
    <p>&copy; 2025 Abby Baynton. All rights reserved.</p>
</footer>

<script>
document.getElementById('contactForm').addEventListener('submit', function(e){
    e.preventDefault();
    fetch(this.action, {method:'POST', body:new FormData(this)})
      .then(()=>{
          document.getElementById('contactMsg').style.display='block';
          this.reset();
          setTimeout(()=>location.reload(), 2000);
      });
});
</script>
</body>
</html>
